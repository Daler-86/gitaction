name: eigth_workflow

on:
  workflow_dispatch:
    inputs:
      titleCustom:
        description: Type The Title
        type: string
        required: true
        default: "Hello World"
      selectCustom:
        description: Select Value
        type: choice
        required: true
        options:
          - Value 1
          - Value 2
          - Value 3
          - Value 4
        default: "Value 2"
      CheckCustom:
        description: Checkbox
        type: boolean
        required: false
jobs:
  run-first-command:
    runs-on: ubuntu-latest
    steps:
      - name: Event Vars
        run: |
          echo "Title: ${{ inputs.titleCustom}}"
          echo "Title: ${{ inputs.selectCustom}}"
          echo "Title: ${{ inputs.CheckCustom}}"
         